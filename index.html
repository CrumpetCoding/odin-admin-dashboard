<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Dashboard</title>
</head>

<body>
    <div id="container">
        <div id="sidebar">
            <h1>Sidebar</h1>
            <div id="side-link">
                <span id="home-icon" class="material-icons">home</span>
                <p>Home</p>
            </div>
            <div id="side-link">
                <span id="profile-icon" class="material-icons">face</span>
                <p>Profile</p>
            </div>
            <div id="side-link">
                <span id="message-icon" class="material-icons">message</span>
                <p>Messages</p>
            </div>
            <div id="side-link">
                <span id="history-icon" class="material-icons">history</span>
                <p>History</p>
            </div>
            <div id="side-link">
                <span id="tasks-icon" class="material-icons">task</span>
                <p>Tasks</p>
            </div>
            <div id="side-link">
                <span id="community-icon" class="material-icons">groups</span>
                <p>Communities</p>
            </div>
        </div>
        <div id="header">
            <span id="search-icon" class="material-icons">search</span>
            <input id="search-bar" type="text">
        </div>
        <div id="main">
            <h1>Main</h1>
        </div>
    </div>
</body>

</html>
